name: Import, test and deploy

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - 'uploads/**'
      - 'game/**'
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redalert-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.import.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import the verified original game archive
        id: import
        run: python scripts/import-game.py
      - name: Preserve the complete imported source in this repository
        if: steps.import.outputs.imported == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- game
          git commit -m 'Import complete RedAlert3D Command 1.0.0 project [skip ci]'
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        if: steps.import.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Run the original simulation and network tests
        if: steps.import.outputs.ready == 'true'
        working-directory: game
        run: npm test
      - name: Build the static website
        if: steps.import.outputs.ready == 'true'
        run: python scripts/build-site.py
      - uses: actions/upload-pages-artifact@v3
        if: steps.import.outputs.ready == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify GitHub Pages configuration
        uses: actions/configure-pages@v5
      - name: Publish the game
        id: deployment
        uses: actions/deploy-pages@v4
